name: Update fundamentals
on:
  schedule:
    - cron: "30 12 * * 1-5"   # 6:00 pm IST, weekdays
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python fundamentals.py
      - name: Commit changes
        run: |
          git config user.name "fundamentals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/fundamentals.csv
          git diff --cached --quiet || git commit -m "Refresh fundamentals"
          git push
